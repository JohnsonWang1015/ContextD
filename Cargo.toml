[package]
name = "contextd"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Developer Context & Semantic Memory Manager for AI coding agents"
license = "MIT"
repository = "https://github.com/contextd/contextd"
readme = "README.md"
keywords = ["ai", "memory", "mcp", "context", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "contextd"
path = "src/lib.rs"

[[bin]]
name = "contextd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rusqlite = { version = "0.40", features = ["bundled", "chrono", "functions", "backup"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
serde_json = "1"
sha2 = "0.10"
# Same version and features as the main dependency, so tests link one SQLite.
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
