name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the others: ContextD claims to
      # work on all three, so all three have to report.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  wheel:
    name: wheel builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5

      # The packaging is part of the product: `uv tool install contextd` is the
      # documented way in, so a broken wheel is a broken release.
      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Install and run it
        run: |
          uv tool install --from dist/*.whl contextd
          "$HOME/.local/bin/contextd" --version
          CONTEXTD_HOME="$RUNNER_TEMP/contextd" "$HOME/.local/bin/contextd" init
